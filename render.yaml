services:
  - type: web
    name: zirro-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: KIE_AI_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_IMAGE_MODEL
        value: google/gemini-3.1-flash-image
      - key: SUPABASE_URL
        value: https://vihbsfrwnslnmheowkhy.supabase.co
      - key: ZIRRO_SUPABASE_PROXY_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_EMBEDDING_MODEL
        value: openai/text-embedding-3-small

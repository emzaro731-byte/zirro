name: Build ZIRRO AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-flutter-android.yml"
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: flutter_app
        run: flutter create --platforms=android --org=com.zirro.ai --project-name=zirro_ai .

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Apply safe Dart lint fixes
        working-directory: flutter_app
        run: dart fix --apply

      - name: Check Dart formatting
        working-directory: flutter_app
        run: dart format lib

      - name: Analyze Flutter code
        working-directory: flutter_app
        run: flutter analyze lib

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=ZIRRO_BUILD_NUMBER=${{ github.run_number }}

      - name: Prepare APK for latest release
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk flutter_app/build/app/outputs/flutter-apk/zirro-ai-latest.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZIRRO AI Android build ${{ github.run_number }}
          body: |
            Automated ZIRRO AI Android build from the main branch.
            Download zirro-ai-latest.apk and confirm installation on Android.
          files: flutter_app/build/app/outputs/flutter-apk/zirro-ai-latest.apk
          make_latest: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zirro-ai-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
